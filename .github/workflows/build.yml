name: build
on:
  push:
    branches:
      - "**"
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Akismet.UmbracoForms.Workflow/Akismet.UmbracoForms.Workflow.sln
