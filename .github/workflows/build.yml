name: build
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "umbraco13"
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build
